# ── Prefix ──────────────────────────────────────────────────────────────────
# Remap prefix from 'C-b' to 'C-a'.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Splits ──────────────────────────────────────────────────────────────────
# Split panes with | and - (and open new splits in the current directory).
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation: prefix then h/j/k/l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this config without restarting tmux: prefix r.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Quality of life ─────────────────────────────────────────────────────────
set -g mouse on                 # click panes, drag borders, scroll history
set -g history-limit 50000      # generous scrollback
set -g base-index 1             # number windows from 1
setw -g pane-base-index 1       # number panes from 1
set -g renumber-windows on      # keep window numbers gapless after closing one
set -sg escape-time 10          # snappier; avoids esc delay in vim
set -g focus-events on
set -g default-terminal "tmux-256color"

# ── Status bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"

# Left: session name.
set -g status-left "#[bg=colour32,fg=colour255,bold] #S #[bg=colour236] "
set -g status-left-length 30

# Windows: current one highlighted.
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-format "#[bg=colour32,fg=colour255,bold] #I:#W "

# Right: machine name + clock.
set -g status-right "#[fg=colour250] #H  #[fg=colour255,bold]%H:%M #[fg=colour250]%d-%b "
set -g status-right-length 40
